<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes API Lab</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="container">
      <h1>QuickNotes API Lab</h1>
      <button id="load-btn">Load notes from server</button>
      <p id="status"></p>
      <ul id="notes-list"></ul>

      <h2>Create a note</h2>
      <form id="note-form">
        <label for="title-input">Title</label>
        <input id="title-input" type="text" placeholder="Enter note title..." />
        <button type="submit">Send to server</button>
      </form>
    </main>
  </body>
</html>
